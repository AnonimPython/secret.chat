#/ ============================================================================
#/  release.yml — сборка бинарников для релизов (Windows .exe, macOS .dmg)
#/  release.yml — build release binaries (Windows .exe, macOS .dmg)
#/ ============================================================================
#/  при пуше тега v* (или ручном запуске) собирает:
#/  when you push a v* tag (or run manually) it builds:
#/    • Windows:  SecretChat.exe  (PyInstaller, spec secretchat.spec)
#/    • macOS:    SecretChat.dmg  (PyInstaller .app -> dmg)
#/  и прикладывает файлы к GitHub Release.
#/  and attaches the files to a GitHub Release.
name: build-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install -r requirements.txt pyinstaller
      - name: build exe
        run: pyinstaller --clean --noconfirm secretchat.spec
      - uses: actions/upload-artifact@v4
        with:
          name: SecretChat-win
          path: dist/SecretChat.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install -r requirements.txt pyinstaller
      - name: build app
        run: pyinstaller --clean --noconfirm secretchat.spec
      - name: make dmg
        run: |
          mkdir -p stage
          cp -R dist/SecretChat.app stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname SecretChat -srcfolder stage -ov -format UDZO dist/SecretChat.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: SecretChat-mac
          path: |
            dist/SecretChat.dmg
            dist/SecretChat.app

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SecretChat-win
          path: win
      - uses: actions/download-artifact@v4
        with:
          name: SecretChat-mac
          path: mac
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            win/SecretChat.exe
            mac/SecretChat.dmg
